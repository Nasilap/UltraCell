plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        ultracell {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "curse.maven:applied-flux-965012:${appflux_file_id}"
    implementation "curse.maven:glodium-957920:${glodium_file_id}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 把 LICENSE 一并打进 jar，并对文件名加模组后缀（与 BiggerAE2 的做法一致）
jar {
    from(file('LICENSE')) {
        rename { "${it}_ultracell" }
    }
}